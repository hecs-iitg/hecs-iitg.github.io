<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
  <title id="title">HECS IITG</title>
  <desc id="desc">Hydrogen, Energy and Combustion Systems Laboratory, IIT Guwahati</desc>
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1593EA"/><stop offset="0.58" stop-color="#005BBB"/><stop offset="1" stop-color="#0B2342"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFB20D"/><stop offset=".55" stop-color="#FF8A00"/><stop offset="1" stop-color="#F04A00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity=".12"/>
    </filter>
  </defs>

  <!-- Compact double-ring emblem -->
  <g transform="translate(12 10)">
    <circle cx="145" cy="150" r="129" fill="#fff" stroke="#0B2342" stroke-width="8"/>
    <circle cx="145" cy="150" r="116" fill="none" stroke="#00A79D" stroke-width="4"/>
    <circle cx="249" cy="72" r="8" fill="#00A79D"/>

    <!-- flow arc -->
    <path d="M55 153 C88 124 119 120 147 133 C180 148 209 141 231 116" fill="none" stroke="#00A79D" stroke-width="8" stroke-linecap="round" opacity=".95"/>
    <path d="M66 161 C97 181 134 185 166 174 C195 164 215 145 231 119" fill="none" stroke="#00A79D" stroke-width="3" stroke-linecap="round" opacity=".55"/>

    <!-- hydrogen drop -->
    <path d="M120 60 C114 90 78 113 78 151 C78 183 99 204 127 204 C155 204 176 182 176 153 C176 116 140 89 120 60 Z" fill="url(#drop)" filter="url(#shadow)"/>
    <path d="M107 101 C94 122 90 142 93 160 C96 174 103 183 111 190" fill="none" stroke="#fff" stroke-width="5" opacity=".28" stroke-linecap="round"/>
    <text x="127" y="160" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="31" font-weight="800" fill="#fff">H<tspan baseline-shift="sub" font-size="18">2</tspan></text>

    <!-- flame -->
    <path d="M166 58 C183 82 180 101 197 118 C210 132 225 145 224 166 C222 191 205 207 180 214 C196 195 195 178 185 167 C177 159 169 151 172 137 C175 120 188 112 183 98 C179 86 169 75 166 58 Z" fill="url(#flame)" filter="url(#shadow)"/>
    <path d="M188 117 C204 136 207 149 201 161 C196 172 189 178 181 183 C188 169 182 161 178 154 C174 146 178 136 188 117 Z" fill="#fff" opacity=".95"/>

    <!-- simplified piston / engine -->
    <g fill="#0B2342" filter="url(#shadow)">
      <rect x="104" y="194" width="84" height="13" rx="3"/>
      <rect x="107" y="211" width="78" height="7" rx="2"/>
      <path d="M109 222 H183 V245 H162 C156 245 153 241 153 236 V230 H139 V236 C139 241 136 245 130 245 H109 Z"/>
      <circle cx="146" cy="234" r="13"/>
      <path d="M140 244 L132 266 L143 274 H150 L160 266 L152 244 Z"/>
    </g>
    <circle cx="146" cy="234" r="7" fill="#fff" stroke="#C9D0D8" stroke-width="3"/>
    <circle cx="146" cy="265" r="6" fill="#fff" stroke="#0B2342" stroke-width="3"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(315 0)">
    <text x="0" y="134" font-family="Arial,DejaVu Sans,sans-serif" font-size="108" font-weight="800" letter-spacing="3" fill="#0B2342">HECS</text>
    <line x1="4" y1="165" x2="76" y2="165" stroke="#00A79D" stroke-width="5"/>
    <text x="94" y="184" font-family="Arial,DejaVu Sans,sans-serif" font-size="55" font-weight="800" letter-spacing="11" fill="#00A79D">IITG</text>
    <line x1="285" y1="165" x2="357" y2="165" stroke="#00A79D" stroke-width="5"/>
    <text x="2" y="231" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" letter-spacing="1" fill="#0B2342">HYDROGEN  •  ENERGY  •  COMBUSTION SYSTEMS</text>
    <text x="2" y="270" font-family="Arial,DejaVu Sans,sans-serif" font-size="22" font-weight="600" letter-spacing=".5" fill="#5F7180">Indian Institute of Technology Guwahati</text>
  </g>
</svg>
